<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Khôi Phục Mật Khẩu – Phúc Gia Tiên Admin</title>
<meta name="description" content="Khôi phục mật khẩu quản trị viên Phúc Gia Tiên Gốm Sứ">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/components.css">
<style>
.login-form-group{margin-bottom:var(--sp-5)}
.login-label{display:block;font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--text-secondary);margin-bottom:var(--sp-2)}
.login-input{width:100%;padding:12px var(--sp-4);border:1.5px solid var(--border);border-radius:var(--r-md);font-size:var(--fs-base);color:var(--text-primary);background:#fff;outline:none;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,146,42,.12)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border:none;border-radius:var(--r-md);font-size:var(--fs-base);font-weight:var(--fw-bold);cursor:pointer;letter-spacing:.04em;transition:all var(--t-fast);margin-top:var(--sp-2)}
.login-btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:var(--shadow-gold)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-error{background:var(--danger-bg);border:1px solid rgba(220,38,38,.25);color:var(--danger);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sm);margin-bottom:var(--sp-4);display:none}
.login-success{background:#f0fdf4;border:1px solid rgba(34,197,94,.25);color:#166534;border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sm);margin-bottom:var(--sp-4);display:none}
.login-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(200,146,42,.4);animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) rotate(720deg);opacity:0}}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:var(--fs-sm);text-decoration:none;margin-top:var(--sp-5);transition:color var(--t-fast)}
.back-link:hover{color:var(--accent)}
.back-link svg{width:16px;height:16px}
.input-wrapper{position:relative}
.toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;font-size:18px;line-height:1;transition:color var(--t-fast)}
.toggle-pass:hover{color:var(--accent)}
.recovery-info{background:var(--accent-bg);border:1px solid var(--accent-bg-strong);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-xs);color:var(--text-secondary);margin-bottom:var(--sp-5);line-height:1.6}
.recovery-info strong{color:var(--accent-dark)}
</style>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="admin-login-body">
<div class="login-particles" id="particles"></div>
<div class="login-card">
  <div class="login-card__header">
    <div class="login-card__logo" style="background: none; border: none; padding: 0; margin-bottom: 16px;"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Logo" style="width: 120px; height: auto; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));"></div>
    <h1 class="login-card__title">Khôi Phục Mật Khẩu</h1>
    <p class="login-card__subtitle">Nhập mã khôi phục để đặt lại mật khẩu Admin</p>
  </div>

  <div class="recovery-info">
    🔐 <strong>Mã khôi phục (Recovery Key)</strong> được cấu hình trên máy chủ bởi quản trị viên hệ thống. Liên hệ người quản lý server nếu bạn không biết mã này.
  </div>

  <div id="recovery-error" class="login-error">❌ Đã xảy ra lỗi.</div>
  <div id="recovery-success" class="login-success">✅ Đặt lại mật khẩu thành công!</div>

  <form id="recovery-form" autocomplete="off">
    <div class="login-form-group">
      <label class="login-label" for="recovery-key">Mã khôi phục (Recovery Key)</label>
      <div class="input-wrapper">
        <input id="recovery-key" class="login-input" type="password" placeholder="Nhập mã khôi phục..." required autocomplete="off">
        <button type="button" class="toggle-pass" data-target="recovery-key" title="Hiện/ẩn">👁</button>
      </div>
    </div>
    <div class="login-form-group">
      <label class="login-label" for="new-password">Mật khẩu mới</label>
      <div class="input-wrapper">
        <input id="new-password" class="login-input" type="password" placeholder="Tối thiểu 6 ký tự" required minlength="6" autocomplete="new-password">
        <button type="button" class="toggle-pass" data-target="new-password" title="Hiện/ẩn">👁</button>
      </div>
    </div>
    <div class="login-form-group">
      <label class="login-label" for="confirm-password">Xác nhận mật khẩu mới</label>
      <div class="input-wrapper">
        <input id="confirm-password" class="login-input" type="password" placeholder="Nhập lại mật khẩu mới" required minlength="6" autocomplete="new-password">
        <button type="button" class="toggle-pass" data-target="confirm-password" title="Hiện/ẩn">👁</button>
      </div>
    </div>
    <button type="submit" class="login-btn">🔓 Đặt Lại Mật Khẩu</button>
  </form>

  <a href="login" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Quay lại trang đăng nhập
  </a>
</div>

<div id="admin-toast-container"></div>
<script src="js/admin-data.js?v=20260701"></script>
<script src="js/admin-core.js?v=20260701"></script>
<script>
// Clean URL address bar
if (window.location.pathname && window.location.pathname.endsWith('/forgot-password.html')) {
  window.history.replaceState(null, '', window.location.pathname.replace(/\/forgot-password\.html$/i, '/forgot-password') + window.location.search);
}
// Particles
(function(){
  var c=document.getElementById('particles');
  for(var i=0;i<18;i++){
    var p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(6+Math.random()*10)+'s';
    p.style.animationDelay=(Math.random()*8)+'s';
    p.style.width=p.style.height=(2+Math.random()*4)+'px';
    c.appendChild(p);
  }
})();

// Toggle password visibility
document.querySelectorAll('.toggle-pass').forEach(function(btn){
  btn.addEventListener('click', function(){
    var target = document.getElementById(btn.dataset.target);
    if(target.type === 'password'){
      target.type = 'text';
      btn.textContent = '🙈';
    } else {
      target.type = 'password';
      btn.textContent = '👁';
    }
  });
});

// Recovery form submission
document.getElementById('recovery-form').addEventListener('submit', function(e){
  e.preventDefault();
  var recoveryKey = document.getElementById('recovery-key').value.trim();
  var newPass = document.getElementById('new-password').value;
  var confirmPass = document.getElementById('confirm-password').value;
  var errEl = document.getElementById('recovery-error');
  var successEl = document.getElementById('recovery-success');
  var btn = document.querySelector('.login-btn');

  errEl.style.display = 'none';
  successEl.style.display = 'none';

  // Validate
  if(!recoveryKey){
    errEl.textContent = '❌ Vui lòng nhập mã khôi phục.';
    errEl.style.display = 'block';
    return;
  }
  if(newPass.length < 6){
    errEl.textContent = '❌ Mật khẩu mới phải có ít nhất 6 ký tự.';
    errEl.style.display = 'block';
    return;
  }
  if(newPass !== confirmPass){
    errEl.textContent = '❌ Mật khẩu xác nhận không khớp.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Đang xử lý...';

  var isLiveServer = window.location.port !== '5055' && window.location.port !== '7275';
  var API_BASE = isLiveServer ? 'http://localhost:5055/api' : '/api';

  fetch(API_BASE + '/auth/recovery-reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ recoveryKey: recoveryKey, newPassword: newPass })
  })
  .then(function(res){
    return res.json().then(function(data){ return { ok: res.ok, data: data }; });
  })
  .then(function(result){
    if(result.ok){
      successEl.textContent = '✅ ' + (result.data.message || 'Đặt lại mật khẩu thành công!');
      successEl.style.display = 'block';
      document.getElementById('recovery-form').reset();
      // Redirect to login after 2 seconds
      setTimeout(function(){ window.location.href = 'login'; }, 2000);
    } else {
      errEl.textContent = '❌ ' + (result.data.message || 'Đã xảy ra lỗi.');
      errEl.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = '🔓 Đặt Lại Mật Khẩu';
  })
  .catch(function(){
    errEl.textContent = '❌ Không thể kết nối đến máy chủ. Vui lòng thử lại.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '🔓 Đặt Lại Mật Khẩu';
  });
});
</script>
</body>
</html>
