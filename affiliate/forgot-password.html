<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu CTV - Bát Tràng Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

<body class="auth-layout">
    <div class="auth-card">
        <div class="auth-header">
            <img src="images/logo.png" alt="Gốm Phúc Gia Tiên" class="auth-logo-img js-config-logo">
            <h1 class="auth-title" id="pageTitle">Khôi phục mật khẩu</h1>
            <p class="auth-subtitle" id="pageSubtitle">Vui lòng nhập email tài khoản của bạn</p>
        </div>

        <!-- Form nhập Email -->
        <form id="forgotForm">
            <div id="forgotAlert" class="alert alert-error" style="display:none;"></div>
            <div id="forgotSuccess" class="alert alert-success" style="display:none; background:#ecfdf5; color:#059669; border:1px solid #059669; padding:12px; border-radius:6px; margin-bottom:15px; font-size:0.9rem;"></div>
            
            <div class="form-group">
                <label class="form-label required-star">Email đã đăng ký</label>
                <input type="email" id="email" class="form-control" required placeholder="Nhập email của bạn">
                <div class="error-text" id="err-email">Vui lòng nhập đúng định dạng email</div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Gửi yêu cầu</button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="login" class="auth-link" style="font-size: 0.9rem;">Quay lại đăng nhập</a>
            </div>
        </form>

        <!-- Form nhập Mật khẩu mới (chỉ hiện khi có token) -->
        <form id="resetForm" style="display: none;">
            <div id="resetAlert" class="alert alert-error" style="display:none;"></div>
            
            <div class="form-group">
                <label class="form-label required-star">Mật khẩu mới</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" class="form-control" required placeholder="Nhập mật khẩu mới">
                    <button type="button" class="toggle-password" id="toggleNewPwd" tabindex="-1">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
                <div class="error-text" id="err-newPassword">Mật khẩu phải từ 6 ký tự</div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Cập nhật mật khẩu</button>
        </form>

    </div>

    <script src="js/api.min.js?v=20260707_fix23"></script>
    <script>
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        // Parse URL params
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const emailFromUrl = urlParams.get('email');

        const forgotForm = document.getElementById('forgotForm');
        const resetForm = document.getElementById('resetForm');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');

        if (token && emailFromUrl) {
            // Mode Đặt lại mật khẩu
            forgotForm.style.display = 'none';
            resetForm.style.display = 'block';
            pageTitle.textContent = "Đặt mật khẩu mới";
            pageSubtitle.textContent = `Cho tài khoản ${emailFromUrl}`;
        }

        // --- FORGOT FORM LOGIC ---
        const emailInput = document.getElementById('email');
        const errEmail = document.getElementById('err-email');
        
        emailInput.addEventListener('input', () => {
            emailInput.classList.remove('is-invalid');
            errEmail.style.display = 'none';
        });

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertEl = document.getElementById('forgotAlert');
            const successEl = document.getElementById('forgotSuccess');
            alertEl.style.display = 'none';
            successEl.style.display = 'none';

            const val = emailInput.value.trim();
            if (!emailRegex.test(val)) {
                emailInput.classList.add('is-invalid');
                errEmail.style.display = 'block';
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = "Đang gửi...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/affiliates/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emailOrPhone: val })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    successEl.textContent = data.message || 'Hướng dẫn đã được gửi qua email.';
                    successEl.style.display = 'block';
                    emailInput.value = '';
                } else {
                    alertEl.textContent = '⚠️ ' + (data.message || 'Có lỗi xảy ra');
                    alertEl.style.display = 'block';
                    emailInput.classList.add('is-invalid');
                }
            } catch (err) {
                alertEl.textContent = '⚠️ Lỗi kết nối đến máy chủ.';
                alertEl.style.display = 'block';
            } finally {
                btn.textContent = "Gửi yêu cầu";
                btn.disabled = false;
            }
        });

        // --- RESET FORM LOGIC ---
        const newPwdInput = document.getElementById('newPassword');
        const errNewPwd = document.getElementById('err-newPassword');

        const toggleBtn = document.getElementById('toggleNewPwd');
        if (toggleBtn && newPwdInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = newPwdInput.type === 'password';
                newPwdInput.type = isPassword ? 'text' : 'password';
                toggleBtn.querySelector('.eye-open').style.display = isPassword ? 'none' : 'block';
                toggleBtn.querySelector('.eye-closed').style.display = isPassword ? 'block' : 'none';
            });
        }

        newPwdInput.addEventListener('input', () => {
            newPwdInput.classList.remove('is-invalid');
            errNewPwd.style.display = 'none';
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertEl = document.getElementById('resetAlert');
            alertEl.style.display = 'none';

            const pwd = newPwdInput.value;
            if (pwd.length < 6) {
                newPwdInput.classList.add('is-invalid');
                errNewPwd.style.display = 'block';
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = "Đang xử lý...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/affiliates/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        emailOrPhone: emailFromUrl,
                        tokenOrOtp: token,
                        newPassword: pwd
                    })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    showToast('Đổi mật khẩu thành công!', 'success');
                    setTimeout(() => { window.location.href = 'login'; }, 1500);
                } else {
                    alertEl.textContent = '⚠️ ' + (data.message || 'Có lỗi xảy ra');
                    alertEl.style.display = 'block';
                }
            } catch (err) {
                alertEl.textContent = '⚠️ Lỗi kết nối đến máy chủ.';
                alertEl.style.display = 'block';
            } finally {
                btn.textContent = "Cập nhật mật khẩu";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
