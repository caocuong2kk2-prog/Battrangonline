<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CTV Bát Tràng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>
    <script src="js/api.js?v=5"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            renderLayout('dashboard', 'Tổng Quan Affiliate');

            try {
                const [stats, profile] = await Promise.all([
                    Api.request('/affiliates/stats'),
                    Api.request('/affiliates/profile')
                ]);

                // Show incomplete profile banner if bank info is missing
                const missingBank = !profile?.bankName || !profile?.bankAccount || !profile?.bankOwner;
                const bannerDismissed = localStorage.getItem('profileBannerDismissed');
                const bannerHtml = (missingBank && !bannerDismissed) ? `
                    <div id="profileWarningBanner" style="background:#fffbeb; border:1px solid #fcd34d; border-radius:10px; padding:14px 18px; margin-bottom:20px; display:flex; align-items:center; gap:14px; position:relative; flex-wrap:wrap;">
                        <span style="font-size:1.5rem;">⚠️</span>
                        <div style="flex:1; min-width: 200px;">
                            <strong style="color:#92400e;">Hồ sơ chưa hoàn thiện</strong>
                            <p style="margin:2px 0 0; font-size:0.88rem; color:#78350f;">Bổ sung thông tin ngân hàng để có thể yêu cầu rút hoa hồng.</p>
                        </div>
                        <a href="profile" style="background:#d97706; color:white; padding:8px 16px; border-radius:7px; font-size:0.85rem; font-weight:600; text-decoration:none; white-space:nowrap; margin-right: 24px;">Cập nhật ngay</a>
                        <button onclick="dismissProfileBanner()" style="position:absolute; top:12px; right:12px; background:none; border:none; color:#b45309; cursor:pointer; font-size:1.4rem; padding:4px; line-height: 1;">&times;</button>
                    </div>
                ` : '';
                // Get today's date for Shopee-like header
                const today = new Date().toLocaleDateString('vi-VN');

                // Calculate tier progress
                let currentTierText = profile.tier || 'Thường';
                let nextTier = '';
                let nextMin = 0;
                let currentMin = 0;
                let currentBonus = 0;

                let rev = stats.monthlyRevenue || 0;
                let tConf = stats.tierConfig;

                // Fix: Cấp bậc hiện tại LÀ cấp bậc trong database (chưa qua kỳ duyệt thì chưa được thăng hạng)
                currentBonus = 0;
                if (currentTierText === 'Kim Cương') currentBonus = tConf.diamondBonus;
                else if (currentTierText === 'Vàng') currentBonus = tConf.goldBonus;
                else if (currentTierText === 'Bạc') currentBonus = tConf.silverBonus;

                // Xác định mốc rank tiếp theo dựa trên DOANH THU thực tế đang có
                if (rev >= tConf.diamondMinRevenue) {
                    nextTier = null;
                } else if (rev >= tConf.goldMinRevenue) {
                    nextTier = 'Kim Cương';
                    nextMin = tConf.diamondMinRevenue;
                } else if (rev >= tConf.silverMinRevenue) {
                    nextTier = 'Vàng';
                    nextMin = tConf.goldMinRevenue;
                } else {
                    nextTier = 'Bạc';
                    nextMin = tConf.silverMinRevenue;
                }

                // Nếu doanh thu chưa đạt nhưng rank hiện tại lại cao hơn (ví dụ giữ rank từ tháng trước)
                if (currentTierText === 'Kim Cương') nextTier = null;
                else if (currentTierText === 'Vàng' && (!nextTier || nextTier === 'Vàng' || nextTier === 'Bạc')) {
                    nextTier = 'Kim Cương';
                    nextMin = tConf.diamondMinRevenue;
                } else if (currentTierText === 'Bạc' && (!nextTier || nextTier === 'Bạc')) {
                    nextTier = 'Vàng';
                    nextMin = tConf.goldMinRevenue;
                }

                let progressPercent = 100;
                let statusMsg = '';
                if (nextTier) {
                    progressPercent = Math.min(100, Math.max(0, (rev / nextMin) * 100));

                    // Thêm thông báo nếu đã vưso với rank hiện tại
                    if (currentTierText === 'Thường' && rev >= tConf.silverMinRevenue) {
                        statusMsg = `Đã đạt điều kiện lên Bạc! Còn ${(nextMin - rev).toLocaleString('vi-VN')}đ nữa để lên ${nextTier}`;
                    } else if (currentTierText === 'Bạc' && rev >= tConf.goldMinRevenue) {
                        statusMsg = `Đã đạt điều kiện lên Vàng! Còn ${(nextMin - rev).toLocaleString('vi-VN')}đ nữa để lên ${nextTier}`;
                    } else {
                        statusMsg = `Còn ${(nextMin - rev).toLocaleString('vi-VN')}đ nữa để lên hạng ${nextTier}`;
                    }
                } else {
                    statusMsg = "Chúc mừng! Bạn đã đạt mức doanh thu cao nhất (Kim Cương)";
                }

                let bgGradient = 'linear-gradient(135deg, #15803d 0%, #22c55e 100%)'; // Thường (Green)
                if (currentTierText === 'Bạc') {
                    bgGradient = 'linear-gradient(135deg, #475569 0%, #94a3b8 100%)'; // Bạc (Slate)
                } else if (currentTierText === 'Vàng') {
                    bgGradient = 'linear-gradient(135deg, #a16207 0%, #eab308 100%)'; // Vàng (Gold)
                } else if (currentTierText === 'Kim Cương') {
                    bgGradient = 'linear-gradient(135deg, #0f766e 0%, #2dd4bf 100%)'; // Kim Cương (Teal)
                }

                const tierHtml = `
                    <div style="background: ${bgGradient}; border-radius: 12px; padding: 20px; color: white; margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px;">
                            <div>
                                <div style="font-size: 0.9rem; opacity: 0.9; margin-bottom: 4px;">Cấp bậc hiện tại của bạn</div>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <h2 style="margin: 0; font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px;">${currentTierText}</h2>
                                    <span style="background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;">+${currentBonus}% hoa hồng</span>
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 0.9rem; opacity: 0.9; margin-bottom: 4px;">Doanh thu tháng này</div>
                                <div style="font-size: 1.4rem; font-weight: 700;">${rev.toLocaleString('vi-VN')}đ</div>
                            </div>
                        </div>
                        
                        ${nextTier ? `
                        <div>
                            <div style="font-size: 0.95rem; opacity: 0.9; margin-bottom: 8px;">
                                ${statusMsg}
                            </div>
                            <div style="height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; display: flex;">
                                <div style="width: ${progressPercent}%; background: white; border-radius: 4px;"></div>
                            </div>
                            <div style="text-align: right; font-size: 0.8rem; opacity: 0.9; margin-top: 6px; font-weight: 600;">
                                ${progressPercent.toFixed(1)}%
                            </div>
                        </div>
                        ` : `
                        <div style="font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                            <span>🏆</span> Bạn đã đạt cấp bậc cao nhất!
                        </div>
                        `}
                    </div>
                `;

                const html = `${bannerHtml}
                    ${tierHtml}
                    <h3 style="font-size:1.1rem; font-weight:700; color:#111827; margin-bottom:12px; margin-top:24px; display:flex; align-items:center; gap:8px;">
                        <span style="font-size:1.4rem;">📊</span> Tổng quan hoạt động
                    </h3>
                    <!-- Active period display -->
                    <div id="activePeriodBar" style="display:flex;align-items:center;gap:6px;margin-bottom:16px;padding:7px 12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;font-size:0.85rem;color:#374151;max-width:max-content;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <span style="color:#6b7280;">Dữ liệu:</span>
                        <span id="activePeriodText" style="font-weight:700;color:#111827;">Tháng ${new Date().getMonth() + 1}/${new Date().getFullYear()}</span>
                    </div>
                    <style>
                        .dashboard-cards-grid {
                            display: grid;
                            gap: 12px;
                            margin-bottom: 32px;
                            grid-template-columns: repeat(6, 1fr);
                        }
                        @media (max-width: 1366px) {
                            .dashboard-cards-grid {
                                grid-template-columns: repeat(3, 1fr);
                                gap: 16px;
                            }
                        }
                        @media (max-width: 1024px) {
                            .dashboard-cards-grid {
                                grid-template-columns: repeat(2, 1fr);
                            }
                        }
                        @media (max-width: 640px) {
                            .dashboard-cards-grid {
                                grid-template-columns: 1fr;
                            }
                        }
                    </style>
                    <div id="all-cards-container" class="dashboard-cards-grid">
                        ${buildDashboardCardsHtml(stats)}
                    </div>
                    
                    <!-- Top 5 Products Table -->
                    <div class="card" style="margin-bottom: 24px;">
                        <div class="card-header">
                            <h3 class="card-title" style="font-weight: 600;">Top 5 sản phẩm của tôi</h3>
                        </div>
                        <div class="table-responsive" style="overflow-x: auto; padding: 0;">
                            <table class="table" style="width: 100%; border-collapse: collapse; min-width: 600px;">
                                <thead>
                                    <tr style="border-bottom: 1px solid #e5e7eb; background-color: #f9fafb;">
                                        <th style="padding: 14px 16px; text-align: left; font-weight: 600; color: #374151; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; width: 40%;">Sản Phẩm</th>
                                        <th style="padding: 14px 16px; text-align: center; font-weight: 600; color: #374151; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Đã Bán</th>
                                        <th style="padding: 14px 16px; text-align: right; font-weight: 600; color: #374151; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Hoa Hồng (VNĐ)</th>
                                        <th style="padding: 14px 16px; text-align: center; font-weight: 600; color: #374151; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="topProductsTableBody">
                                    ${(stats.topProducts && stats.topProducts.length > 0) ? stats.topProducts.map((p, index) => {
                    const imageUrl = (p.imageUrl && p.imageUrl.trim() !== '') ? p.imageUrl : '/images/product-placeholder.png';
                    return `
                                    <tr style="border-bottom: 1px solid #f3f4f6; transition: background 0.2s;" onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='transparent'">
                                        <td style="padding: 16px; font-size: 0.9rem;">
                                            <div style="display: flex; align-items: center; gap: 12px;">
                                                <div style="width: 28px; height: 28px; border-radius: 6px; background: ${index === 0 ? '#fef3c7' : index === 1 ? '#f3f4f6' : index === 2 ? '#fff7ed' : '#f8fafc'}; color: ${index === 0 ? '#d97706' : index === 1 ? '#4b5563' : index === 2 ? '#c2410c' : '#94a3b8'}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0;">#${index + 1}</div>
                                                <img src="${imageUrl}" onerror="this.src='/images/product-placeholder.png'" style="width: 46px; height: 46px; border-radius: 8px; object-fit: cover; border: 1px solid #e5e7eb; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                                                <div style="min-width: 0; flex: 1;">
                                                    <div style="font-weight: 500; color: #111827; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4;">${p.productName}</div>
                                                    <div style="font-size: 0.8rem; color: #6b7280; margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                                                        ${p.sku ? `<span style="font-weight: 500; color: #4b5563;">Mã: ${p.sku}</span><span style="display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: #d1d5db;"></span>` : ''}
                                                        <span style="font-weight: 600; color: #4b5563;">${p.averagePrice.toLocaleString('vi-VN')}đ</span>
                                                        <span style="display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: #d1d5db;"></span>
                                                        <span style="color: #059669; font-weight: 600; background: #ecfdf5; padding: 2px 6px; border-radius: 4px;">Hoa hồng ${p.commissionRate}%</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td style="padding: 16px; text-align: center;">
                                            <span style="display: inline-block; padding: 4px 10px; background: #eff6ff; color: #2563eb; font-weight: 600; font-size: 0.85rem; border-radius: 20px;">${p.quantitySold}</span>
                                        </td>
                                        <td style="padding: 16px; text-align: right; font-size: 0.95rem; font-weight: 700; color: #dc2626;">+${p.estimatedCommission.toLocaleString('vi-VN')}đ</td>
                                        <td style="padding: 16px; text-align: center;">
                                            <a href="/product-detail.html?id=${p.productId}" target="_blank" style="display: inline-block; color: white; text-decoration: none; font-weight: 500; font-size: 0.8rem; padding: 6px 14px; background: var(--primary); border-radius: 6px; box-shadow: 0 2px 4px rgba(200, 146, 42, 0.2); transition: all 0.2s;" onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 6px rgba(200, 146, 42, 0.3)'" onmouseout="this.style.transform='none'; this.style.boxShadow='0 2px 4px rgba(200, 146, 42, 0.2)'">Xem SP</a>
                                        </td>
                                    </tr>
                                    `;
                }).join('') : `
                                    <tr>
                                        <td colspan="4" style="padding: 24px 16px; text-align: center; font-size: 0.9rem; color: #6b7280;">Chưa có dữ liệu sản phẩm bán chạy.</td>
                                    </tr>
                                    `}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                document.getElementById('pageContent').innerHTML = html;



            } catch (err) {
                document.getElementById('pageContent').innerHTML = `<div class="alert alert-error" style="display:block">Không thể tải dữ liệu: ${err.message}</div>`;
            }
        });



        function calcGrowth(current, previous) {
            if (previous === 0 && current === 0) return null;
            if (previous === 0) return 100;
            return Math.round(((current - previous) / previous) * 100);
        }

        function growthBadge(current, previous, isPositiveGood = true) {
            const pct = calcGrowth(current, previous);
            if (pct === null) return '<span style="font-size:0.7rem;color:#9ca3af;">--</span>';
            const isUp = pct >= 0;
            const isGood = isPositiveGood ? isUp : !isUp;
            const color = isGood ? '#10b981' : '#ef4444';
            const bg = isGood ? '#ecfdf5' : '#fef2f2';
            const arrow = isUp ? '↑' : '↓';
            return `<span style="font-size:0.7rem;font-weight:700;color:${color};background:${bg};padding:2px 6px;border-radius:20px;white-space:nowrap;display:inline-block;">${arrow} ${Math.abs(pct)}% vs kỳ trước</span>`;
        }

        function buildDashboardCardsHtml(stats) {
            const gClicks = growthBadge(stats.validClicks || 0, stats.prevValidClicks || 0);
            const gOrders = growthBadge(stats.totalOrders || 0, stats.prevTotalOrders || 0);
            const gOrderValue = growthBadge(stats.totalOrderValue || 0, stats.prevTotalOrderValue || 0);
            const gCompleted = growthBadge(stats.completedOrders || 0, stats.prevCompletedOrders || 0);
            const gPending = growthBadge(Number(stats.pendingCommission), Number(stats.prevPendingCommission));

            return `
                <!-- 1. Lượt click hợp lệ -->
                <div class="premium-stat-card blue" style="display: flex; flex-direction: column; height: 100%; padding: 14px;">
                    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 8px;">
                        <div style="color:var(--text-muted); font-size:0.8rem; font-weight:600; line-height: 1.2; padding-right: 4px;">
                            Click hợp lệ
                            <span class="info-tooltip-container" style="display:inline-flex; vertical-align: middle; margin-left: 2px;">ℹ️<span class="info-tooltip-text">Chỉ tính tối đa 1 click trong mỗi 60 phút từ cùng 1 người truy cập để chống click ảo, click spam.</span></span>
                        </div>
                        <div class="premium-icon-wrap blue" style="width: 32px; height: 32px; font-size: 1rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">🖱️</div>
                    </div>
                    <div style="font-size:1.25rem;font-weight:800;color:var(--text-dark);line-height:1;letter-spacing:-0.5px;margin-bottom:6px;">${stats.validClicks || 0}</div>
                    <div style="margin-bottom: 10px;">${gClicks}</div>
                    <div style="margin-top: auto; border-top: 1px dashed #e2e8f0; padding-top: 10px; font-size:0.75rem; color:var(--text-muted); font-weight:500;">
                        Người tiếp cận
                    </div>
                </div>
                
                <!-- 2. Đơn hàng phát sinh -->
                <div class="premium-stat-card blue" style="display: flex; flex-direction: column; height: 100%; padding: 14px;">
                    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 8px;">
                        <div style="color:var(--text-muted); font-size:0.8rem; font-weight:600; line-height: 1.2; padding-right: 4px;">
                            Đơn phát sinh
                        </div>
                        <div class="premium-icon-wrap blue" style="width: 32px; height: 32px; font-size: 1rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">📦</div>
                    </div>
                    <div style="font-size:1.25rem;font-weight:800;color:var(--text-dark);line-height:1;letter-spacing:-0.5px;margin-bottom:6px;">${stats.totalOrders}</div>
                    <div style="margin-bottom: 10px;">${gOrders}</div>
                    <div style="margin-top: auto; border-top: 1px dashed #e2e8f0; padding-top: 10px; font-size:0.75rem; color:var(--text-muted); font-weight:500;">
                        Trong kỳ
                    </div>
                </div>

                <!-- 3. Giá trị đơn hàng -->
                <div class="premium-stat-card blue" style="display: flex; flex-direction: column; height: 100%; padding: 14px;">
                    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 8px;">
                        <div style="color:var(--text-muted); font-size:0.8rem; font-weight:600; line-height: 1.2; padding-right: 4px;">
                            Giá trị đơn hàng
                            <span class="info-tooltip-container" style="display:inline-flex; vertical-align: middle; margin-left: 2px;">ℹ️<span class="info-tooltip-text">Tổng giá trị của tất cả các đơn hàng phát sinh, chưa trừ các khoản phí.</span></span>
                        </div>
                        <div class="premium-icon-wrap blue" style="width: 32px; height: 32px; font-size: 1rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">🏷️</div>
                    </div>
                    <div style="font-size:1.25rem;font-weight:800;color:var(--text-dark);line-height:1;letter-spacing:-0.5px;margin-bottom:6px;">${Number(stats.totalOrderValue || 0).toLocaleString('vi-VN')}<span style="font-size:0.85rem;color:var(--text-muted);margin-left:2px;font-weight:600;">đ</span></div>
                    <div style="margin-bottom: 10px;">${gOrderValue}</div>
                    <div style="margin-top: auto; border-top: 1px dashed #e2e8f0; padding-top: 10px; font-size:0.75rem; color:var(--text-muted); font-weight:500;">
                        Doanh thu
                    </div>
                </div>
                
                <!-- 4. Đơn hoàn thành -->
                <div class="premium-stat-card purple" style="display: flex; flex-direction: column; height: 100%; padding: 14px;">
                    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 8px;">
                        <div style="color:var(--text-muted); font-size:0.8rem; font-weight:600; line-height: 1.2; padding-right: 4px;">
                            Đơn hoàn thành
                            <span class="info-tooltip-container" style="display:inline-flex; vertical-align: middle; margin-left: 2px;">ℹ️<span class="info-tooltip-text">Tổng số đơn hàng giới thiệu đã giao hàng và thanh toán thành công.</span></span>
                        </div>
                        <div class="premium-icon-wrap purple" style="width: 32px; height: 32px; font-size: 1rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">✅</div>
                    </div>
                    <div style="font-size:1.25rem;font-weight:800;color:var(--text-dark);line-height:1;letter-spacing:-0.5px;margin-bottom:6px;">${stats.completedOrders || 0}</div>
                    <div style="margin-bottom: 10px;">${gCompleted}</div>
                    <div style="margin-top: auto; border-top: 1px dashed #e2e8f0; padding-top: 10px; font-size:0.75rem; color:var(--text-muted); font-weight:500;">
                        Giao thành công
                    </div>
                </div>

                <!-- 5. Hoa hồng chờ duyệt -->
                <div class="premium-stat-card orange" style="display: flex; flex-direction: column; height: 100%; padding: 14px;">
                    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 8px;">
                        <div style="color:var(--text-muted); font-size:0.8rem; font-weight:600; line-height: 1.2; padding-right: 4px;">
                            Hoa hồng chờ
                        </div>
                        <div class="premium-icon-wrap orange" style="width: 32px; height: 32px; font-size: 1rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">⏳</div>
                    </div>
                    <div style="font-size:1.25rem;font-weight:800;color:var(--text-dark);line-height:1;letter-spacing:-0.5px;margin-bottom:6px;">${Number(stats.pendingCommission).toLocaleString('vi-VN')}<span style="font-size:0.85rem;color:var(--text-muted);margin-left:2px;font-weight:600;">đ</span></div>
                    <div style="margin-bottom: 10px;">${gPending}</div>
                    <div style="margin-top: auto; border-top: 1px dashed #e2e8f0; padding-top: 10px; font-size:0.75rem; color:#f59e0b; font-weight:500; display:flex; align-items:center; gap:4px;">
                        <span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#f59e0b;"></span> Chờ nhận hàng
                    </div>
                </div>

                <!-- 6. Hoa hồng khả dụng -->
                <div class="premium-stat-card green" style="display: flex; flex-direction: column; height: 100%; padding: 14px;">
                    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 8px;">
                        <div style="color:var(--text-muted); font-size:0.8rem; font-weight:600; line-height: 1.2; padding-right: 4px;">
                            Hoa hồng rút
                        </div>
                        <div class="premium-icon-wrap green" style="width: 32px; height: 32px; font-size: 1rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">💸</div>
                    </div>
                    <div style="font-size:1.25rem;font-weight:800;color:#10b981;line-height:1;letter-spacing:-0.5px;margin-bottom:6px;">${Number(stats.availableBalance).toLocaleString('vi-VN')}<span style="font-size:0.85rem;color:var(--text-muted);margin-left:2px;font-weight:600;">đ</span></div>
                    <div style="margin-bottom: 10px;"><span style="font-size:0.7rem;font-weight:700;color:transparent;user-select:none;padding:2px 6px;display:inline-block;">--</span></div>
                    <div style="margin-top: auto; border-top: 1px dashed #e2e8f0; padding-top: 10px; font-size:0.75rem; color:#10b981; font-weight:600; display:flex; align-items:center; justify-content: space-between;">
                        <span style="display:flex; align-items:center; gap:4px;"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#10b981;"></span> Rút ngay</span>
                    </div>
                </div>
            `;
        }
        function buildTopProductsHtml(topProducts) {
            if (!topProducts || topProducts.length === 0) {
                return `<tr><td colspan="4" style="padding:24px 16px;text-align:center;font-size:0.9rem;color:#6b7280;">Chưa có dữ liệu sản phẩm trong khoảng thời gian này.</td></tr>`;
            }
            return topProducts.map((p, index) => {
                const imageUrl = (p.imageUrl && p.imageUrl.trim() !== '') ? p.imageUrl : '/images/product-placeholder.png';
                const rankBg = index === 0 ? '#fef3c7' : index === 1 ? '#f3f4f6' : index === 2 ? '#fff7ed' : '#f8fafc';
                const rankColor = index === 0 ? '#d97706' : index === 1 ? '#4b5563' : index === 2 ? '#c2410c' : '#94a3b8';
                return `<tr style="border-bottom:1px solid #f3f4f6;transition:background 0.2s;" onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='transparent'">
                    <td style="padding:16px;font-size:0.9rem;">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <div style="width:28px;height:28px;border-radius:6px;background:${rankBg};color:${rankColor};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0;">#${index + 1}</div>
                            <img src="${imageUrl}" onerror="this.src='/images/product-placeholder.png'" style="width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid #e5e7eb;flex-shrink:0;">
                            <div style="min-width:0;flex:1;">
                                <div style="font-weight:500;color:#111827;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;">${p.productName}</div>
                                <div style="font-size:0.8rem;color:#6b7280;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                                    ${p.sku ? `<span style="font-weight:500;color:#4b5563;">Mã: ${p.sku}</span><span style="display:inline-block;width:4px;height:4px;border-radius:50%;background:#d1d5db;"></span>` : ''}
                                    <span style="font-weight:600;color:#4b5563;">${Number(p.averagePrice).toLocaleString('vi-VN')}đ</span>
                                    <span style="color:#059669;font-weight:600;background:#ecfdf5;padding:2px 6px;border-radius:4px;">Hoa hồng ${p.commissionRate}%</span>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td style="padding:16px;text-align:center;"><span style="display:inline-block;padding:4px 10px;background:#eff6ff;color:#2563eb;font-weight:600;font-size:0.85rem;border-radius:20px;">${p.quantitySold}</span></td>
                    <td style="padding:16px;text-align:right;font-size:0.95rem;font-weight:700;color:#dc2626;">+${Number(p.estimatedCommission).toLocaleString('vi-VN')}đ</td>
                    <td style="padding:16px;text-align:center;"><a href="/product-detail?id=${p.productId}" target="_blank" style="display:inline-block;color:white;text-decoration:none;font-weight:500;font-size:0.8rem;padding:6px 14px;background:var(--primary);border-radius:6px;">Xem SP</a></td>
                </tr>`;
            }).join('');
        }
        // Global function to dismiss profile banner
        window.dismissProfileBanner = function () {
            localStorage.setItem('profileBannerDismissed', 'true');
            const banner = document.getElementById('profileWarningBanner');
            if (banner) {
                banner.style.transition = 'opacity 0.3s ease';
                banner.style.opacity = '0';
                setTimeout(() => { banner.style.display = 'none'; }, 300);
            }
        };
    </script>
</body>

</html>
