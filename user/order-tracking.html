<!DOCTYPE html>
<html lang="vi">

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Custom Styling for Tracking Page */
    .tracking-section {
      background-color: #faf7f2;
      padding: var(--space-12) 0 var(--space-20);
      min-height: 70vh;
    }

    .tracking-card {
      background: #ffffff;
      border-radius: var(--radius-xl);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      padding: var(--space-8);
      border: 1px solid rgba(200, 146, 42, 0.12);
      margin-bottom: var(--space-8);
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }

    .tracking-title {
      font-family: var(--font-heading);
      font-size: var(--fs-3xl);
      color: #2c1a0c;
      text-align: center;
      margin-bottom: var(--space-2);
    }

    .tracking-desc {
      text-align: center;
      color: #6b4c2e;
      margin-bottom: var(--space-8);
      font-size: var(--fs-sm);
    }

    /* Form Styles */
    .tracking-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      max-width: 500px;
      margin: 0 auto;
    }

    .tracking-input-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .tracking-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #5c3a1e;
    }

    .tracking-input-wrap {
      position: relative;
      display: flex;
    }

    .tracking-input {
      flex: 1;
      padding: 14px 16px;
      border: 1.5px solid #d4c4b0;
      border-radius: var(--radius-md) 0 0 var(--radius-md);
      font-family: var(--font-body);
      font-size: var(--fs-sm);
      color: #1a0f05;
      background: #fff;
      transition: all 0.25s ease;
    }

    .tracking-input::placeholder {
      color: #8a6a50;
      opacity: 1;
    }

    .tracking-input:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 4px rgba(200, 146, 42, 0.08);
    }

    .tracking-btn-search {
      padding: 0 var(--space-6);
      border: none;
      background: var(--color-primary);
      color: #ffffff;
      font-family: var(--font-body);
      font-weight: 600;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .tracking-btn-search:hover {
      background: var(--color-primary-light);
    }

    /* Orders List Styling */
    .user-orders-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      max-width: 800px;
      margin: 0 auto;
    }

    .order-summary-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(200, 146, 42, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .order-summary-card:hover {
      box-shadow: 0 8px 25px rgba(200, 146, 42, 0.06);
      transform: translateY(-2px);
    }

    .order-summary-header {
      padding: var(--space-4) var(--space-6);
      background: #faf7f2;
      border-bottom: 1px solid rgba(200, 146, 42, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-3);
    }

    .order-header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .order-code-badge {
      font-weight: 700;
      color: var(--color-primary);
      font-size: var(--fs-md);
    }

    .order-date-label {
      font-size: var(--fs-xs);
      color: #705945; /* Dark brown for high contrast on white card */
    }

    .order-badge-status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .status-pending { background-color: #fef3c7; color: #d97706; }
    .status-confirmed { background-color: #dbeafe; color: #2563eb; }
    .status-packing { background-color: #f3e8ff; color: #7c3aed; }
    .status-shipping { background-color: #e0f2fe; color: #0284c7; }
    .status-delivered { background-color: #d1fae5; color: #059669; }
    .status-cancelled { background-color: #fee2e2; color: #dc2626; }

    .order-summary-body {
      padding: var(--space-5) var(--space-6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-4);
    }

    .order-quick-details p {
      font-size: var(--fs-sm);
      margin-bottom: 4px;
      color: #5a4738; /* Dark brown primary text for high contrast */
    }

    .order-quick-details p:last-child {
      margin-bottom: 0;
    }

    .order-quick-details strong {
      color: #1a0f05; /* Blackish brown for important information */
    }

    .order-total-price {
      text-align: right;
    }

    .order-total-price .label {
      font-size: var(--fs-xs);
      color: #705945; /* Dark brown muted text for high contrast */
      display: block;
      margin-bottom: 2px;
    }

    .order-total-price .price {
      font-size: var(--fs-lg);
      font-weight: 700;
      color: var(--color-accent);
    }

    .order-summary-footer {
      padding: var(--space-4) var(--space-6);
      border-top: 1px dashed rgba(200, 146, 42, 0.1);
      display: flex;
      justify-content: flex-end;
      background: #fff;
    }

    .btn-toggle-details {
      background: none;
      border: 1px solid var(--color-accent);
      color: var(--color-accent);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--fs-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-toggle-details:hover {
      background: var(--color-accent);
      color: #ffffff;
    }

    /* Order Details (Dark Theme matching order-success.html) */
    .order-details-drawer {
      display: none;
      background: #2a1508;
      color: #ffffff;
      padding: var(--space-6) var(--space-6) var(--space-8);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      animation: slideDown 0.3s ease-out forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .order-details-drawer.active {
      display: block;
    }

    .order-details-drawer .success-order-box {
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 0;
      box-shadow: none;
    }

    .order-details-drawer .success-grid__title {
      color: var(--color-accent);
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }

    .order-details-drawer .success-items-title {
      color: var(--color-accent);
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }

    .order-details-drawer .success-order-total {
      border-top-color: rgba(255, 255, 255, 0.15);
    }

    /* Alert Boxes */
    .tracking-alert {
      padding: var(--space-4) var(--space-5);
      border-radius: var(--radius-md);
      font-size: var(--fs-sm);
      margin-bottom: var(--space-6);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .alert-error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .alert-info {
      background-color: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .alert-success {
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    /* Image Modal */
    .img-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
    }
    .img-modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 90vh;
      border-radius: var(--radius-md);
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    }
    .img-modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
    }
    .img-modal-close:hover,
    .img-modal-close:focus {
      color: #bbb;
      text-decoration: none;
    }
  </style>

</head>

  <script>
    // ============================================
    // ORDER TRACKING CONTROLLER
    // ============================================
    (function() {
      'use strict';

      // Map status keys to Vietnamese text and CSS classes
      var STATUS_MAP = {
        'pending': { text: 'Chờ xác nhận', cls: 'status-pending' },
        'confirmed': { text: 'Đã xác nhận', cls: 'status-confirmed' },
        'packing': { text: 'Đang đóng gói', cls: 'status-packing' },
        'shipping': { text: 'Đang giao hàng', cls: 'status-shipping' },
        'completed': { text: 'Giao hàng thành công', cls: 'status-delivered' },
        'cancelled': { text: 'Đã huỷ', cls: 'status-cancelled' }
      };

      // Retrieve all orders from localStorage
      function loadAllOrders() {
        try {
          return JSON.parse(localStorage.getItem('pgt_orders') || '[]');
        } catch(e) {
          return [];
        }
      }

      // Format order status history timeline
      function renderTimelineHtml(order) {
        if (order.status === 'cancelled') {
          return '<h3 class="success-timeline-title" style="color: #dc2626;">Đơn Hàng Đã Bị Huỷ</h3>'
            + '<div class="tracking-alert alert-error" style="margin-top: 12px; margin-bottom: 0; background-color: #fee2e2; border-color: #fca5a5; color: #991b1b; padding: 12px 16px; border-radius: var(--radius-md); font-size: var(--fs-sm);">'
            + 'Đơn hàng này đã bị hủy trên hệ thống. Quý khách vui lòng liên hệ hotline của cửa hàng để nhận hỗ trợ nhanh chóng nhất.'
            + '</div>';
        }

        var steps = [
          { key: 'pending', label: 'Đặt hàng thành công', defaultNote: 'Đơn hàng đã được tiếp nhận.' },
          { key: 'confirmed', label: 'Đã xác nhận', defaultNote: 'Cửa hàng đã xác nhận đơn.' },
          { key: 'shipping', label: 'Đang giao hàng', defaultNote: 'Đơn hàng đang trên đường giao đến quý khách.' },
          { key: 'completed', label: 'Giao hàng thành công', defaultNote: 'Cảm ơn quý khách đã mua sắm!' }
        ];

        var currentStep = steps.findIndex(function(s) { return s.key === order.status; });
        if (currentStep === -1) {
          // Fallback mapping for older keys if present
          if (order.status === 'delivered') currentStep = 3;
          else if (order.status === 'packing') currentStep = 1; // map packing close to confirmed
          else currentStep = 0;
        }

        var timelineHtml = '';
        steps.forEach(function(step, idx) {
          var histEntry = (order.statusHistory || []).filter(function(h) { return h.status === step.key; }).pop();
          var isDone = idx < currentStep;
          var isActive = idx === currentStep;
          var cls = isDone ? 'done' : (isActive ? 'active' : '');
          var time = histEntry ? histEntry.time : '';
          
          // Fallback time for first step if no statusHistory exists
          if (step.key === 'pending' && !time && order.date) {
            time = order.date;
          }
          
          if (time && window.formatDate) {
            time = window.formatDate(time);
          }
          
          var note = histEntry ? histEntry.note : ((isDone || isActive) ? step.defaultNote : '');

          timelineHtml += '<div class="success-step ' + cls + '">'
            + '<div class="success-step__dot">' + (isDone || isActive ? '✓' : '') + '</div>'
            + '<div class="success-step__label">' + step.label + '</div>'
            + (time ? '<div class="success-step__time">' + time + '</div>' : '')
            + (note && (isDone || isActive) ? '<div class="success-step__note">' + note + '</div>' : '')
            + '</div>';
        });

        return '<h3 class="success-timeline-title">Tiến Độ Đơn Hàng</h3>'
          + '<div class="success-timeline">' + timelineHtml + '</div>';
      }

      // Render single order card
      function renderOrderCard(order, index) {
        var statusInfo = STATUS_MAP[order.status] || { text: order.status, cls: 'status-pending' };
        var totalVND = window.formatVND ? window.formatVND(order.total) : (order.total + '₫');
        
        // Preprocess items: group gifts into their main products
        var structuredItems = [];
        var currentProduct = null;
        
        (order.items || []).forEach(function(item) {
          if (item.name && item.name.indexOf('[Quà Tặng]') === 0) {
            if (currentProduct) {
              currentProduct.gifts = currentProduct.gifts || [];
              currentProduct.gifts.push({
                 name: item.name.replace('[Quà Tặng]', '').trim(),
                 quantity: item.qty / (currentProduct.qty || 1),
                 imageUrl: item.image || item.imageUrl
              });
            } else {
              structuredItems.push(item);
            }
          } else {
            currentProduct = Object.assign({}, item);
            structuredItems.push(currentProduct);
          }
        });

        // Build items HTML
        var itemsHtml = structuredItems.map(function(item) {
          var priceVal = window.formatVND ? window.formatVND(item.price * item.qty) : ((item.price * item.qty) + '₫');
          
          // Image resolution logic (use item.image if present, else fallback based on name)
          var imgUrl = item.image;
          if (!imgUrl) {
            var cleanName = (item.name || '').toLowerCase().trim();
            if (cleanName.indexOf('lộc bình vẽ tay') >= 0) imgUrl = 'assets/images/product-1-1.jpg';
            else if (cleanName.indexOf('lộc bình men ra') >= 0 || cleanName.indexOf('lộc bình men rạn') >= 0) imgUrl = 'assets/images/product-2-1.jpg';
            else if (cleanName.indexOf('lộc bình trổ') >= 0) imgUrl = 'assets/images/product-3-1.jpg';
            else if (cleanName.indexOf('tranh gốm phúc lộc thọ') >= 0) imgUrl = 'assets/images/product-4-1.jpg';
            else if (cleanName.indexOf('bộ đồ thờ') >= 0 || cleanName.indexOf('chóe bày') >= 0) imgUrl = 'assets/images/product-5-1.jpg';
            else if (cleanName.indexOf('bình hút lộc') >= 0 || cleanName.indexOf('bình hoa sen') >= 0) imgUrl = 'assets/images/product-6-1.jpg';

      window.currentRawOrders = [];
      
      window.applyDateFilter = function() {
        applyAndRenderOrders();

      window.clearDateFilter = function() {
        var fromEl = document.getElementById('filter-date-from');
        var toEl = document.getElementById('filter-date-to');
        if (fromEl) fromEl.value = '';
        if (toEl) toEl.value = '';
        applyAndRenderOrders();
      };
      
      function applyAndRenderOrders() {
        var fromEl = document.getElementById('filter-date-from');
        var toEl = document.getElementById('filter-date-to');
        var fromDate = fromEl ? fromEl.value : '';
        var toDate = toEl ? toEl.value : '';
        
        var filtered = window.currentRawOrders || [];
        if (fromDate || toDate) {
          filtered = filtered.filter(function(o) {
            if (!o.date && !o.timestamp) return true;
            
            var orderDateVal = null;
            if (o.timestamp) {
               orderDateVal = new Date(o.timestamp);
            } else if (o.date) {
               var dStr = o.date.indexOf('T') > -1 ? o.date.split('T')[0] : o.date.split(' ')[0];
               if (dStr.indexOf('-') > -1) {
                 var dParts = dStr.split('-');
                 if (dParts.length === 3) {
                   orderDateVal = new Date(parseInt(dParts[0], 10), parseInt(dParts[1], 10)-1, parseInt(dParts[2], 10));
                 }
               } else if (dStr.indexOf('/') > -1) {
                 var slashParts = dStr.split('/');
                 if (slashParts.length === 3) {
                   orderDateVal = new Date(parseInt(slashParts[2], 10), parseInt(slashParts[1], 10)-1, parseInt(slashParts[0], 10));
                 }
               }
               if (!orderDateVal || isNaN(orderDateVal.getTime())) {
                 orderDateVal = new Date(o.date);
               }
            }
            
            // If date is completely invalid, hide it when filtering is active
            if (!orderDateVal || isNaN(orderDateVal.getTime())) return false;
            
            orderDateVal.setHours(0,0,0,0);
            
            if (fromDate) {
              var fParts = fromDate.split('-');
              var f = new Date(parseInt(fParts[0], 10), parseInt(fParts[1], 10)-1, parseInt(fParts[2], 10));
              f.setHours(0,0,0,0);
              if (orderDateVal < f) return false;
            }
            if (toDate) {
              var tParts = toDate.split('-');
              var t = new Date(parseInt(tParts[0], 10), parseInt(tParts[1], 10)-1, parseInt(tParts[2], 10));
              t.setHours(0,0,0,0);
              if (orderDateVal > t) return false;
            }
            return true;
          });
        }
        
        var container = document.getElementById('tracking-results-container');
        if (!container) return;

        if (!filtered || filtered.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: #8a6a50; padding: var(--space-8); background: #fff; border-radius: var(--radius-lg); border: 1px solid rgba(200, 146, 42, 0.12);">Không có đơn hàng nào được tìm thấy.</div>';
          return;
        }

        var html = filtered.map(function(order, idx) {
          return renderOrderCard(order, idx);
        }).join('');

        container.innerHTML = html;
      }
      
      // Render multiple orders list
      function renderOrdersList(orders) {
        window.currentRawOrders = orders || [];
        
        // Show/hide filter based on results count
        var filterDiv = document.getElementById('tracking-date-filter');
        if (filterDiv) {
          if (orders && orders.length > 1) {
             filterDiv.style.display = 'block';
          } else {
             filterDiv.style.display = 'none';
          }
        }
        
        applyAndRenderOrders();
      }

      // Modal functions
      window.openImgModal = function(src) {
        var modal = document.getElementById('product-img-modal');
        if (modal) {
          var isVideo = /\.(mp4|mov|avi|webm|ogg)$/i.test(src);
          // Remove old content except close button
          var contentNodes = modal.querySelectorAll('.img-modal-content');
          contentNodes.forEach(function(n) { n.remove(); });
          
          if (isVideo) {
             var vid = document.createElement('video');
             vid.className = 'img-modal-content';
             vid.src = src;
             vid.controls = true;
             vid.autoplay = true;
             vid.style.maxWidth = '90%';
             vid.style.maxHeight = '90vh';
             vid.style.objectFit = 'contain';
             modal.appendChild(vid);
          } else {
             var img = document.createElement('img');
             img.className = 'img-modal-content';
             img.src = src;
             modal.appendChild(img);
          }
          modal.style.display = 'flex';
        }
      };

      window.closeImgModal = function(e) {
        if (!e.target.classList.contains('img-modal-content')) {
          var modal = document.getElementById('product-img-modal');
          if (modal) {
             modal.style.display = 'none';
             // Pause video if playing
             var vid = modal.querySelector('video.img-modal-content');
             if (vid) vid.pause();
          }
        }
      };

      window.openCancelModal = function(code, phone, type) {
        document.getElementById('cancel-order-code').value = code;
        document.getElementById('cancel-order-phone').value = phone;
        document.getElementById('cancel-reason-input').value = '';
        var title = type === 'pending' ? 'Hủy Đơn Hàng' : 'Yêu Cầu Hủy Đơn';
        var desc = type === 'pending' ? 'Đơn hàng sẽ được hủy ngay lập tức. Vui lòng nhập lý do (tùy chọn):' : 'Đơn hàng đang đóng gói. Vui lòng nhập lý do để Gửi yêu cầu hủy đến Cửa hàng:';
        document.getElementById('cancel-modal-title').innerText = title;
        document.getElementById('cancel-modal-desc').innerText = desc;
        document.getElementById('btn-submit-cancel').innerText = type === 'pending' ? 'Xác nhận Hủy' : 'Gửi Yêu Cầu';
        document.getElementById('cancel-order-modal').style.display = 'flex';
      };

      window.closeCancelModal = function() {
        document.getElementById('cancel-order-modal').style.display = 'none';
      };

      window.submitCancelOrder = function() {
        var code = document.getElementById('cancel-order-code').value;
        var phone = document.getElementById('cancel-order-phone').value;
        var reason = document.getElementById('cancel-reason-input').value.trim();
        var btn = document.getElementById('btn-submit-cancel');
        btn.disabled = true;
        btn.innerText = 'Đang xử lý...';

        fetch(window.PhucGiaTienAPI.apiBase + '/orders/' + code + '/cancel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phone, reason: reason })
        })
        .then(function(res) { return res.json().then(function(data) { return { status: res.status, data: data }; }); })
        .then(function(res) {
          btn.disabled = false;
          if (res.status >= 200 && res.status < 300) {
            closeCancelModal();
            window.showToast(res.data.message, 'success');
            var searchInput = document.getElementById('search-query-input');
            var token = localStorage.getItem('customer_token') || sessionStorage.getItem('customer_token');
            if (token && window.PhucGiaTienAPI && typeof window.PhucGiaTienAPI.getCustomerOrders === 'function') {
                window.PhucGiaTienAPI.getCustomerOrders().then(function(userOrders) {
                    if (userOrders) renderOrdersList(userOrders);
                });
            } else if (searchInput && searchInput.value) {
                window.handleTrackingSearch();
            } else {
                // Update local storage and re-render instantly without reloading
                if (window.PhucGiaTienAPI && typeof window.PhucGiaTienAPI.getOrder === 'function') {
                  window.PhucGiaTienAPI.getOrder(code).then(function(liveOrder) {
                    var all = loadAllOrders();
                    var idx = all.findIndex(function(x) { return x.orderCode.toLowerCase() === code.toLowerCase(); });
                    if (idx >= 0) {
                      all[idx].status = liveOrder.status;
                      all[idx].isCancelRequested = liveOrder.isCancelRequested;
                      all[idx].cancelReason = liveOrder.cancelReason;
                      localStorage.setItem('pgt_orders', JSON.stringify(all));
                    }
                    renderOrdersList(all);
                  }).catch(function() {
                    setTimeout(function() { window.location.reload(); }, 1500);
                  });
                } else {
                  setTimeout(function() { window.location.reload(); }, 1500);
                }
            }
          } else {
            window.showToast(res.data.message || 'Không thể thực hiện yêu cầu.', 'error');
            btn.innerText = document.getElementById('cancel-modal-title').innerText.includes('Yêu Cầu') ? 'Gửi Yêu Cầu' : 'Xác nhận Hủy';
          }
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.innerText = document.getElementById('cancel-modal-title').innerText.includes('Yêu Cầu') ? 'Gửi Yêu Cầu' : 'Xác nhận Hủy';
          window.showToast('Lỗi kết nối.', 'error');
        });
      };

      // Display alert banner
      function showAlert(message, type) {
        var area = document.getElementById('notification-area');
        if (!area) return;
        
        var cls = type === 'error' ? 'alert-error' : (type === 'success' ? 'alert-success' : 'alert-info');
        area.innerHTML = '<div class="tracking-alert ' + cls + '">' + message + '</div>';
        
        // Clear after a few seconds if it is success or info
        if (type !== 'error') {
          setTimeout(function() {
            area.innerHTML = '';
          }, 5000);
        }
      }

      function clearAlert() {
        var area = document.getElementById('notification-area');
        if (area) area.innerHTML = '';
      }

      // Search Handler
      window.handleTrackingSearch = function(e) {
        if (e) e.preventDefault();
        
        var query = document.getElementById('search-query-input').value.trim();
        if (!query) return;

        clearAlert();
        
        var allOrders = loadAllOrders();
        var normalizedQuery = query.replace(/\s+/g, '').toLowerCase();
        var queryDigits = query.replace(/\D/g, '');

        // 1. Search locally
        var filtered = allOrders.filter(function(order) {
          var codeMatch = order.orderCode.toLowerCase() === normalizedQuery;
          var phoneMatch = false;
          if (queryDigits && queryDigits.length >= 8) {
            var orderPhoneDigits = order.phone.replace(/\D/g, '');
            phoneMatch = orderPhoneDigits.endsWith(queryDigits) || queryDigits.endsWith(orderPhoneDigits);
          }
          return codeMatch || phoneMatch;
        });

        // 2. If Order Code search or we have local results, query real-time backend API
        var isOrderCodeQuery = normalizedQuery.startsWith('dh') || normalizedQuery.startsWith('pgt') || (query.length >= 5 && !queryDigits);

        if (isOrderCodeQuery) {
          var searchBtn = document.getElementById('btn-search-tracking');
          if (searchBtn) searchBtn.disabled = true;
          
          window.PhucGiaTienAPI.getOrder(query)
            .then(function(liveOrder) {
              if (searchBtn) searchBtn.disabled = false;
              
              var orderData = {
                orderCode: liveOrder.orderCode,
                date: liveOrder.date,
                timestamp: Date.now(),
                name: liveOrder.customerName,
                phone: liveOrder.customerPhone,
                address: liveOrder.address,
                customerNote: liveOrder.customerNote,
                paymentMethod: 'Thanh toán khi nhận hàng (COD)',
                items: (liveOrder.items || []).map(function(i) {
                  return { name: i.name, qty: i.qty, price: i.price, size: i.size, image: i.image || '', productId: i.productId };
                }),
                total: liveOrder.total,
                status: liveOrder.status,
                isCancelRequested: liveOrder.isCancelRequested,
                statusHistory: liveOrder.statusHistory || []
              };

              // Sync to localStorage
              var all = loadAllOrders();
              var idx = all.findIndex(function(x) { return x.orderCode.toLowerCase() === liveOrder.orderCode.toLowerCase(); });
              if (idx >= 0) {
                all[idx] = orderData;
              } else {
                all.unshift(orderData);
              }
              localStorage.setItem('pgt_orders', JSON.stringify(all));

              showAlert('Tìm thấy thông tin đơn hàng thời gian thực!', 'success');
              renderOrdersList([orderData]);
            })
            .catch(function(err) {
              if (searchBtn) searchBtn.disabled = false;
              
              if (filtered.length > 0) {
                showAlert('Tìm thấy đơn hàng từ lịch sử trình duyệt (Chế độ offline)!', 'info');
                renderOrdersList(filtered);
              } else {
                showAlert('Không tìm thấy đơn hàng phù hợp. Vui lòng kiểm tra lại Số điện thoại hoặc Mã đơn hàng.', 'error');
                renderOrdersList([]);
              }
            });
        } else {
          // Searching by phone
          if (filtered.length > 0) {
            showAlert('Tìm thấy ' + filtered.length + ' đơn hàng trong lịch sử trình duyệt!', 'success');
            renderOrdersList(filtered);
            
            // Background sync for latest statuses
            filtered.forEach(function(localOrder, fIdx) {
              if (fIdx < 3 && window.PhucGiaTienAPI && typeof window.PhucGiaTienAPI.getOrder === 'function') {
                window.PhucGiaTienAPI.getOrder(localOrder.orderCode)
                  .then(function(liveOrder) {
                    localOrder.status = liveOrder.status;
                    localOrder.customerNote = liveOrder.customerNote;
                    localOrder.total = liveOrder.total;
                    
                    var all = loadAllOrders();
                    var aIdx = all.findIndex(function(x) { return x.orderCode.toLowerCase() === localOrder.orderCode.toLowerCase(); });
                    if (aIdx >= 0) {
                      all[aIdx].status = liveOrder.status;
                      all[aIdx].customerNote = liveOrder.customerNote;
                      all[aIdx].total = liveOrder.total;
                      localStorage.setItem('pgt_orders', JSON.stringify(all));
                    }
                    renderOrdersList(filtered);
                  })
                  .catch(function() {});
              }
            });
          } else {
            showAlert('Không tìm thấy đơn hàng phù hợp. Vui lòng kiểm tra lại Số điện thoại hoặc Mã đơn hàng.', 'error');
            renderOrdersList([]);
          }
        }
      };

      // Initialize page on load
      function initTrackingPage() {
        var currentUser = null;
        try {
          currentUser = JSON.parse(localStorage.getItem('current_user') || sessionStorage.getItem('current_user'));
        } catch(e) {}
        
        var token = localStorage.getItem('customer_token') || sessionStorage.getItem('customer_token');
        var searchCardContainer = document.getElementById('search-card-container');
        var resultsContainer = document.getElementById('tracking-results-container');
        
        if (currentUser && token) {
          if (searchCardContainer) searchCardContainer.style.display = 'none';
          
          var fullName = currentUser.name || [currentUser.firstName, currentUser.lastName].filter(Boolean).join(' ') || 'Quý khách';
          var titleHtml = '<div style="text-align: center; margin-bottom: var(--space-8);">' +
                          '<h2 class="tracking-title" style="margin-bottom: var(--space-2);">Lịch Sử Đơn Hàng</h2>' +
                          '<p style="color: var(--color-accent); font-weight: 600; font-size: var(--fs-md);">Xin chào, ' + fullName + '</p>' +
                          '</div>';
          
          resultsContainer.insertAdjacentHTML('beforebegin', titleHtml);
          resultsContainer.innerHTML = '<div style="text-align: center; color: #8a6a50;">Đang tải danh sách đơn hàng...</div>';

          if (window.PhucGiaTienAPI && typeof window.PhucGiaTienAPI.getCustomerOrders === 'function') {
            window.PhucGiaTienAPI.getCustomerOrders()
              .then(function(userOrders) {
                if (userOrders && userOrders.length > 0) {
                  renderOrdersList(userOrders);
                } else {
                  resultsContainer.innerHTML = '<div style="text-align: center; color: #8a6a50;">Bạn chưa có đơn hàng nào.</div>';
                }
              })
              .catch(function(err) {
                resultsContainer.innerHTML = '<div class="tracking-alert alert-error">Không thể tải danh sách đơn hàng.</div>';
              });
          }
        } else {
          // Guest / Not logged-in state: show search card
          if (searchCardContainer) {
            searchCardContainer.style.display = 'block';
            // Add a login prompt below the form
            var loginPrompt = '<p style="text-align: center; margin-top: var(--space-6); font-size: var(--fs-sm); color: #6b4c2e;">' +
                              'Đã có tài khoản? <a href="login" style="color: var(--color-accent); font-weight: 600; text-decoration: underline;">Đăng nhập ngay</a> để xem toàn bộ lịch sử đơn hàng.' +
                              '</p>';
            if (!searchCardContainer.innerHTML.includes('Đã có tài khoản?')) {
              searchCardContainer.insertAdjacentHTML('beforeend', loginPrompt);
            }
          }

          var allOrders = loadAllOrders();
          if (allOrders.length > 0) {
            allOrders.sort(function(a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
            var recentTitleHtml = '<div style="text-align: center; margin-bottom: var(--space-8);"><h2 class="tracking-title" id="recent-orders-title">Đơn Hàng Gần Đây</h2></div>';
            
            // Prevent duplicate titles if re-rendering
            if (!document.getElementById('recent-orders-title')) {
                resultsContainer.insertAdjacentHTML('beforebegin', recentTitleHtml);
            }
            
            renderOrdersList(allOrders);
            
            // Background sync for recent orders to ensure fresh status
            allOrders.forEach(function(localOrder, fIdx) {
              if (fIdx < 3 && window.PhucGiaTienAPI && typeof window.PhucGiaTienAPI.getOrder === 'function') {
                window.PhucGiaTienAPI.getOrder(localOrder.orderCode)
                  .then(function(liveOrder) {
                    localOrder.status = liveOrder.status;
                    localOrder.customerNote = liveOrder.customerNote;
                    localOrder.total = liveOrder.total;
                    
                    var all = loadAllOrders();
                    var aIdx = all.findIndex(function(x) { return x.orderCode.toLowerCase() === localOrder.orderCode.toLowerCase(); });
                    if (aIdx >= 0) {
                      all[aIdx].status = liveOrder.status;
                      all[aIdx].customerNote = liveOrder.customerNote;
                      all[aIdx].total = liveOrder.total;
                      localStorage.setItem('pgt_orders', JSON.stringify(all));
                    }
                    renderOrdersList(allOrders);
                  })
                  .catch(function() {});
              }
            });
          }
          
          // Optionally, pre-fill search input if query string is present (e.g. ?code=PGT123)
          var params = new URLSearchParams(window.location.search);
          var codeParam = params.get('code') || params.get('phone');
          if (codeParam) {
            var input = document.getElementById('search-query-input');
            if (input) {
              input.value = codeParam;
              window.handleTrackingSearch();
            }
          }
        }
        
        // ── REALTIME UPDATES VIA SIGNALR ──
        if (window.signalR && window.PhucGiaTienAPI && window.PhucGiaTienAPI.apiBase) {
          var hubUrl = window.PhucGiaTienAPI.apiBase.replace('/api', '/hub/notifications');
          var connection = new signalR.HubConnectionBuilder()
            .withUrl(hubUrl)
            .withAutomaticReconnect()
            .build();
            
          connection.on("ReceiveNotification", function(eventType, message) {
            if (eventType === 'OrderStatusChanged' || eventType === 'OrderCancelled' || eventType === 'CancelRequested' || eventType === 'OrderDeleted') {
              var match = message.match(/#([A-Za-z0-9]+)/);
              if (match && match[1]) {
                var updatedCode = match[1].toLowerCase();
                var needsRefresh = false;
                
                var all = loadAllOrders();
                if (all.some(function(o) { return o.orderCode.toLowerCase() === updatedCode; })) {
                  needsRefresh = true;
                }
                
                if (window.localStorage.getItem('customer_token') || window.sessionStorage.getItem('customer_token')) {
                  needsRefresh = true;
                }
                
                if (needsRefresh) {
                   if ((window.localStorage.getItem('customer_token') || window.sessionStorage.getItem('customer_token')) && typeof window.PhucGiaTienAPI.getCustomerOrders === 'function') {
                      window.PhucGiaTienAPI.getCustomerOrders().then(function(userOrders) {
                        if (userOrders) renderOrdersList(userOrders);
                      }).catch(function(){});
                   } else if (typeof window.PhucGiaTienAPI.getOrder === 'function') {
                      window.PhucGiaTienAPI.getOrder(updatedCode).then(function(liveOrder) {
                        var aIdx = all.findIndex(function(x) { return x.orderCode.toLowerCase() === updatedCode; });
                        if (aIdx >= 0) {
                          all[aIdx].status = liveOrder.status;
                          all[aIdx].isCancelRequested = liveOrder.isCancelRequested;
                          all[aIdx].cancelReason = liveOrder.cancelReason;
                          localStorage.setItem('pgt_orders', JSON.stringify(all));
                        }
                        renderOrdersList(all);
                      }).catch(function() {
                        var filtered = all.filter(function(x) { return x.orderCode.toLowerCase() !== updatedCode; });
                        localStorage.setItem('pgt_orders', JSON.stringify(filtered));
                        renderOrdersList(filtered);
                      });
                   }
                }
              }
            }
          });
          
          connection.start().catch(function(err) {
            console.error('[SignalR] Tracking Hub Connection Error:', err);
          });
        }
      }

      // Wait for components to load then initialize
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          setTimeout(initTrackingPage, 500);
        });
      } else {
        setTimeout(initTrackingPage, 500);
      }
    })();
  </script>
</body>

</html>
