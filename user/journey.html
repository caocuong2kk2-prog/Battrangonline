  <style>
    /* ===== JOURNEY PAGE SPECIFIC STYLES ===== */

    /* Premium Story Tabs Navigation (Optimized for PC & Mobile UX) */
    .story-tabs {
      display: flex;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto var(--space-8);
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 6px;
      background: #ffffff;
      border: 1px solid rgba(200, 146, 42, 0.35);
      border-radius: 9999px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .story-tab-btn {
      padding: 10px 24px;
      font-size: var(--fs-sm);
      font-weight: 600;
      color: #5a4632;
      border: 1px solid transparent;
      border-radius: 9999px;
      white-space: nowrap;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .story-tab-btn:hover {
      color: #b8860b;
      background: rgba(200, 146, 42, 0.12);
      border-color: rgba(200, 146, 42, 0.3);
    }

    .story-tab-btn.active {
      color: #ffffff !important;
      background: linear-gradient(135deg, #c8922a, #dfa538) !important;
      border-color: #c8922a !important;
      font-weight: 700 !important;
      box-shadow: 0 4px 14px rgba(200, 146, 42, 0.45) !important;
      transform: translateY(-1px);
    }

    /* Mobile UX: Hiển thị trọn vẹn 100% các chủ đề thành chùm viên thuốc đẹp mắt, không bắt khách hàng vuốt ngang */
    @media (max-width: 640px) {
      .story-tabs {
        width: 100%;
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 0;
        gap: 8px;
        border-radius: 0;
      }
      .story-tab-btn {
        background: #ffffff;
        border: 1px solid rgba(200, 146, 42, 0.3);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        padding: 8.5px 15px;
        font-size: 13px;
      }
    }

    .story-panel {
      display: none;
    }

    .story-panel.active {
      display: block;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: var(--space-10);
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 16px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--color-accent), transparent);
    }

    .timeline-item {
      position: relative;
      margin-bottom: var(--space-10);
      padding-left: var(--space-8);
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -18px;
      top: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--color-accent);
      border: 2px solid var(--color-bg-dark);
      box-shadow: 0 0 0 3px rgba(212, 168, 83, 0.25);
    }

    .timeline-item__date {
      font-size: var(--fs-base);
      font-weight: var(--fw-bold);
      color: var(--color-accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: var(--space-2);
    }

    .timeline-item__title {
      font-family: var(--font-heading);
      font-size: var(--fs-xl);
      font-weight: var(--fw-bold);
      color: var(--color-accent);
      margin-bottom: var(--space-3);
    }

    .timeline-item__desc {
      font-size: var(--fs-base);
      color: var(--color-primary);
      line-height: 1.8;
    }

    /* Video grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-5);
    }
    @media (max-width: 1024px) {
      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 640px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    .video-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 16/9;
      background: var(--color-bg-card);
      cursor: pointer;
      border: 1px solid var(--color-border);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
    }

    .video-card:hover {
      transform: translateY(-4px) !important;
      box-shadow: var(--shadow-md);
    }

    .video-card__thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-card__overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 15, 5, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
    }

    .video-card__play {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(212, 168, 83, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: transform var(--transition-normal), background var(--transition-normal);
    }

    .video-card:hover .video-card__play {
      transform: scale(1.1);
      background: var(--color-accent);
    }

    .video-card__duration {
      font-size: var(--fs-xs);
      color: var(--color-text-primary);
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }

    .video-card__title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: var(--space-3) var(--space-4);
      background: linear-gradient(to top, rgba(26, 15, 5, 0.9), transparent);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      color: var(--color-text-primary);
    }

    .btn-load-more {
      width: fit-content;
      display: block;
      color: var(--color-accent);
      background-color: var(--color-bg-card);
      margin: var(--space-8) auto 0;
      transition: transform 0.25s ease,
        opacity 0.25s ease;
    }

    .btn-load-more:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>

</body>
